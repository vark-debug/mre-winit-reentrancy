[package]
name = "mre-winit-reentrancy"
version = "0.1.0"
edition = "2024"

[dependencies]
# Same versions as the crashing applications (storytold/filmcraft, gridcraft, figcraft).
# The `winit-0.31-beta` branch switches to "=0.31.0-beta.3", where the re-entrancy guard
# no longer panics (winit-appkit's maybe_queue_with_handler just queues + logs).
winit = "=0.31.0-beta.3"
rfd = "=0.17.2"
pollster = "0.4"
# Software rendering for the buttons (no GUI toolkit between the MRE and winit).
softbuffer = "0.4"
# Decoding the embedded UI image (all on-screen text is a hand-typeset PNG).
png = "0.17"
